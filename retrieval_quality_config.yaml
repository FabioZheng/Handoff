# Low-cost MS MARCO v2.1 retrieval-quality handoff pilot.
model:
  # Confirmed on OpenRouter 2026-08-15 at $0.05/M input, $0.08/M output.
  id: "meta-llama/llama-3.1-8b-instruct"
  provider_order: null
  require_parameters: false

decoding:
  top_p: 1.0
  orchestrator_temperature: 0.0
  subagent_temperature: 0.0
  answer_max_tokens: 32
  handoff_max_tokens: 320

cost:
  # A successful 20-question pilot is expected to be well below this.
  cap_usd: 0.35
  api_call_cap: 650
  warn_at_fraction: 0.8

runtime:
  concurrency: 2
  max_retries: 4
  backoff_base_s: 1.5
  backoff_max_s: 30.0
  request_timeout_s: 120
  cache_dir: cache

dataset:
  # Microsoft’s original blob endpoint presently blocks anonymous downloads;
  # this is Hugging Face's public parquet mirror of the official v2.1 dev set.
  dev_url: "https://huggingface.co/datasets/microsoft/ms_marco/resolve/refs%2Fconvert%2Fparquet/v2.1/validation/0000.parquet"
  local_parquet: data/raw/msmarco_v2.1_validation.parquet
  sample_seed: 20260815
  n_questions: 20
  smoke_questions: 2
  # BM25 retrieval pool: bounded for a fast pure-Python inverted index, but
  # large enough that hard negatives can come from genuinely different
  # queries, not just the target query's own 10 candidate passages.
  bm25_pool_queries: 4000
  bm25_top_k: 50
  # Bottom-ranked eligible passages are the matched easy-negative arm.
  # This is a pool, not a retrieval cutoff: zero-overlap documents are valid.
  bm25_bottom_k: 1000

# Stable machine ids retained for cached artifacts.  Report/plot labels are
# low, medium, and high noise; each remains a fixed ten-passage context.
conditions: [good, medium, bad]
negative_types: [hard, easy]
depths: [0, 1, 3, 5]
max_depth: 5

analysis:
  bootstrap_resamples: 10000
  ci_level: 0.95
  bertscore:
    enabled: true
    model_type: roberta-large
    num_layers: 17
    batch_size: 64
    rescale_with_baseline: true

outputs:
  data_root: data/retrieval_quality
  run_root: runs/retrieval_quality
  result_root: results/retrieval_quality
