# Same evidence-length definitions as chain_config.yaml, with isolated Qwen
# output directories so no Llama run can be overwritten or reused.
datasets:
  musique:
    local_parquet: data/raw/musique_validation.parquet
    parquet_url: https://huggingface.co/datasets/dgslibisey/MuSiQue/resolve/refs%2Fconvert%2Fparquet/default/validation/0000.parquet
    answerable_only: true
  hotpotqa:
    local_parquet: data/raw/hotpotqa_validation.parquet
    parquet_url: https://huggingface.co/datasets/hotpotqa/hotpot_qa/resolve/refs%2Fconvert%2Fparquet/distractor/validation/0000.parquet

sampling:
  seed: 20260811
  n_target_per_dataset: 10
  n_candidates_per_dataset: 40

contexts:
  short:
    max_documents: gold
  medium:
    max_documents: 5
  full:
    max_documents: all

depths: [0, 1, 3, 5]
seeds: [1]

analysis:
  bootstrap_resamples: 10000
  ci_level: 0.95
  primary_metric: f1
  bertscore:
    enabled: true
    model_type: roberta-large
    num_layers: 17
    batch_size: 64
    rescale_with_baseline: true

outputs:
  root: results/chain_qwen
  run_root: runs/chain_qwen
  data_root: data/chain_qwen
