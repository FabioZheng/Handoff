schema: reuse-v1
seed: 20260916
data_root: data/reuse_v2
run_root: runs/reuse
cache_root: cache/reuse
results_root: results/reuse
cohort:
  development_per_corpus: 40
  main_per_corpus: 200
  min_words: 800
  max_words: 8000
  squad_questions: 4
  qasper_max_questions: 6
budgets:
  absolute: [64, 128, 256, 512, 1024, 2048]
  relative: [0.25, 0.5, 0.75, 1.0]
  primary: 256
  fill_floor: 0.85
  corrections: 3
policies: [summary_generic, summary_conditioned, selection_generic, selection_conditioned, bm25, centrality, coverage, random, prefix]
models:
  # BF16 weights are ~66 GB; one 80 GB card leaves room for only ~24k tokens of
  # KV cache, less than one full-length request, so the stack uses two cards.
  qwen32:
    id: Qwen/Qwen3-32B
    revision: 9216db5781bf21249d130ec9da846c4624c16137
    thinking: false
    tensor_parallel: 2
    max_model_len: 32768
  # Available, independent-family replication; Llama's gated weights were inaccessible.
  mistral24:
    id: mistralai/Mistral-Small-3.2-24B-Instruct-2506
    revision: 95a6d26c4bfb886c58daf9d3f7332c857cb27b43
    tensor_parallel: 1
    max_model_len: 32768
    vllm_kwargs:
      tokenizer_mode: mistral
      config_format: mistral
      load_format: mistral
      limit_mm_per_prompt: {image: 0}
judge:
  # Secondary automated check from a third family; native QA metrics stay primary.
  id: microsoft/phi-4
  revision: 2db69c1c3e91a05d2c64a3185acfbaf36f744e25
  tensor_parallel: 1
  max_model_len: 16384
# Protocol settings: part of every request identity and of the protocol hash.
inference:
  dtype: bfloat16
  temperature: 0.0
  top_p: 1.0
  answer_tokens: 512
  judge_tokens: 64
  writer_tokens_per_word: 2.0
  writer_min_tokens: 512
  max_output_tokens: 17000
  vllm_version: 0.29.0
  transformers_version: 5.10.4
  tokenizers_version: 0.23.0rc0
# Operational settings: throughput only. Excluded from request identity and the
# protocol hash, so tuning them never invalidates finished work.
runtime:
  max_num_seqs: 128
  chunk_size: 1024
  docs_per_group: 10
  gpu_memory_utilization: 0.92
analysis:
  primary_metric: f1
  secondary_metrics: [em, judge_correct]
  human_evaluation: false
  bootstrap_samples: 10000
  noninferiority_margin: 0.05
  cross_reader_per_corpus: 50
repeated_handoff:
  documents_per_corpus: 50
  budgets: [256, 512]
  evaluate_depths: [0, 1, 2, 3, 5]
  policies: [summary_generic, summary_conditioned, selection_generic, selection_conditioned]
  anchor_question: fixed_through_chain
  input: previous_message_only
  forward_control: unchanged_depth1_message
  run_root: runs/reuse_repeated
  results_root: results/reuse_repeated
