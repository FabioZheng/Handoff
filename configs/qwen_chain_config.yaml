# Low-cost Qwen replication of the serial handoff-degradation experiment.
# This is deliberately a pilot: same datasets and evidence variants, but fewer
# questions, one seed, and no depths beyond five.
model:
  id: "qwen/qwen3-8b"
  provider_order: null
  require_parameters: false
  # Prevent reasoning-token spend and keep handoff text comparable to the
  # earlier direct prose-summary experiment.
  reasoning:
    effort: "none"

dataset:
  name: "musique"
  split: "validation"
  parquet_url: "https://huggingface.co/datasets/dgslibisey/MuSiQue/resolve/refs%2Fconvert%2Fparquet/default/validation/0000.parquet"
  local_parquet: "data/raw/musique_validation.parquet"
  answerable_only: true

sampling:
  seed: 20260811
  n_target: 10
  n_candidates: 40
  id_list: "data/chain_qwen/sampled_ids.json"

leakage_filter:
  samples: 3
  temperature: 0.7
  max_tokens: 32
  f1_known_threshold: 0.6

decoding:
  top_p: 1.0
  orchestrator_temperature: 0.0
  answer_max_tokens: 64
  subagent_temperature: 0.7
  handoff_max_tokens: 700

seeds: [1]

cost:
  # Conservative dry-run ceiling for the 10-question-per-dataset replication
  # is about $0.13; actual spend is usually much lower because completions
  # stop early.  This remains two orders of magnitude below the main cap.
  cap_usd: 0.15
  api_call_cap: 850
  warn_at_fraction: 0.8

runtime:
  concurrency: 2
  # Avoid letting one provider request hold an entire ten-item checkpoint for
  # many minutes.  A rerun resumes from the cache after a transient failure.
  max_retries: 2
  backoff_base_s: 1.5
  backoff_max_s: 30.0
  request_timeout_s: 60
  cache_dir: "cache"
