# Fixed-10-passage relevant-signal-ratio repeated-handoff pilot.
model:
  id: "meta-llama/llama-3.1-8b-instruct"
  provider_order: null
  require_parameters: false

decoding:
  top_p: 1.0
  orchestrator_temperature: 0.0
  subagent_temperature: 0.0
  answer_max_tokens: 256
  handoff_max_tokens: 700

cost:
  cap_usd: 0.25
  api_call_cap: 650
  warn_at_fraction: 0.8

runtime:
  concurrency: 2
  max_retries: 4
  backoff_base_s: 1.5
  backoff_max_s: 30.0
  request_timeout_s: 120
  cache_dir: cache

dataset:
  parquet_url: "https://huggingface.co/datasets/rajpurkar/squad/resolve/refs%2Fconvert%2Fparquet/plain_text/validation/0000.parquet"
  local_parquet: data/raw/squad_validation.parquet
  sample_seed: 20260817
  n_packs: 20
  smoke_packs: 2
  passages_per_pack: 10

# Exact relevant-document fractions in a fixed ten-passage context.
conditions:
  signal_1_0: 10
  signal_0_5: 5
  signal_0_1: 1
depths: [0, 1, 3, 5]
max_depth: 5

analysis:
  bootstrap_resamples: 10000
  ci_level: 0.95
  bertscore:
    enabled: true
    model_type: roberta-large
    num_layers: 17
    batch_size: 64
    rescale_with_baseline: true

outputs:
  data_root: data/signal_ratio
  run_root: runs/signal_ratio
  result_root: results/signal_ratio
