# Runtime configuration for the generic-summary replication. It is intentionally
# separate so its conservative limits cannot alter any other experiment.
model:
  id: "meta-llama/llama-3.3-70b-instruct"
  provider_order: null
  require_parameters: false

dataset:
  name: "musique"
  split: "validation"
  parquet_url: "https://huggingface.co/datasets/dgslibisey/MuSiQue/resolve/refs%2Fconvert%2Fparquet/default/validation/0000.parquet"
  local_parquet: "data/raw/musique_validation.parquet"
  answerable_only: true

sampling:
  seed: 20260811
  n_target: 30
  n_candidates: 100
  id_list: "data/chain/sampled_ids.json"

leakage_filter:
  samples: 3
  temperature: 0.7
  max_tokens: 32
  f1_known_threshold: 0.6

decoding:
  top_p: 1.0
  orchestrator_temperature: 0.0
  answer_max_tokens: 64
  subagent_temperature: 0.7
  handoff_max_tokens: 700

seeds: [1, 2]

cost:
  cap_usd: 1.10
  api_call_cap: 7500
  warn_at_fraction: 0.8

runtime:
  concurrency: 30
  max_retries: 6
  backoff_base_s: 1.5
  backoff_max_s: 60.0
  request_timeout_s: 180
  cache_dir: "cache"

analysis:
  bootstrap_resamples: 10000
  ci_level: 0.95
