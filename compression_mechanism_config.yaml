# Experiment 14: which compression MECHANISM produces present-task specialisation?
#
# Experiment 10 established that a bounded handoff written for the currently
# known query loses future-query utility, and that the loss grows with the
# designed distance between the future query and the conditioning one. Every arm
# there was abstractive: an LLM read the source and wrote new prose. So two
# things were varying at once - the sender SELECTED what to keep, and it REWROTE
# what it kept - and either could be what commits a message to the present task.
#
# This run separates them on one corpus, one channel, one reader and one judge:
#
#     passthrough             neither rewriting nor scored selection (prefix)
#     paraphrase              rewriting, no deliberate selection
#     generic / conditioned   rewriting + selection      (Experiment 10, reused)
#     lm_*                    selection, no rewriting, LM scorer   (GPT-2)
#     nonllm_*                selection, no rewriting, no neural model at all
#     random_selection        the ordering-free floor
#
# Everything a comparison depends on is inherited byte-identically from
# communication_regret_config.yaml - model, decoding, the word band, the
# rotation design, the reader prompt, the judge - so the stored Experiment 10
# messages and answers are reused rather than regenerated, and the new arms sit
# on exactly the same scale. Only the arm list, the contrasts and the output
# roots differ.

model:
  # Sender AND answerer, identical to Experiment 10. Changing it here would make
  # every reused row a cache miss and every comparison a different experiment.
  id: "meta-llama/llama-3.1-8b-instruct"
  provider_order: null
  require_parameters: false

decoding:
  top_p: 1.0
  sender_temperature: 0.0
  answer_temperature: 0.0
  closed_book_temperature: 0.7
  answer_max_tokens: 32

cost:
  cap_usd: 8.0
  api_call_cap: 90000
  warn_at_fraction: 0.8

runtime:
  concurrency: 12
  max_retries: 6
  backoff_base_s: 1.5
  backoff_max_s: 60.0
  retry_after_max_s: 300.0
  request_timeout_s: 180
  cache_dir: cache

# ---------------------------------------------------------------- the channel
# Identical to Experiment 10, including max_length_corrections, because the
# stored message request hashes cover this whole block.

budget:
  words: [20, 40, 80, 160]
  tokens_per_word: 1.35
  api_max_tokens_headroom: 2.2
  api_max_tokens_floor: 128
  fill_floor_ratio: 0.85
  max_length_corrections: 3
  # Disabled here, unlike Experiment 10. The trim arm re-truncates every arm in
  # a cell to the shortest delivered length; applied across mechanism families
  # it would cut whole-sentence selections mid-sentence, destroying the verbatim
  # property that IS the elimination mechanism. Length equality between families
  # is instead reported (fill ratios per arm) and analysed, not manufactured.
  trim_sensitivity_words: []
  match_tolerance_words: 6

# The arms. Names are Experiment 10's for the two reused ones - renaming
# `generic`/`conditioned` to `summary_*` would change every message key and turn
# 640 free rows into 640 paid ones. The paper's mapping is:
#   generic -> summary_generic, conditioned -> summary_conditioned.
policies:
  - generic
  - conditioned
  - paraphrase
  # Neither rewriting nor scored selection: the front of the source, verbatim,
  # cut at the last sentence boundary that fits. Under a hard budget this is the
  # only form a pass-through can take on sources three times longer than the cap,
  # and it is the control that asks whether a selector beats reading from the top.
  # The UNBOUNDED pass-through is the `direct_context` baseline below.
  - passthrough
  - lm_generic
  - lm_conditioned
  - nonllm_generic
  - nonllm_conditioned
  - random_selection
  # Kept because they are already paid for and bound the picture at both ends:
  # `oracle` sees every question, `reusable` is told more will follow.
  - oracle
  - reusable

# ------------------------------------------------------------- the selectors

elimination:
  # Written by src/lm_unit_scores.py with a pinned local GPT-2. The runner
  # refuses scores whose corpus hash does not match the dossiers it is about to
  # compress, so a stale table cannot silently drive a selection.
  lm_scores_path: data/compression_mechanism/lm_unit_scores.jsonl
  # Query-independent lexical importance for `nonllm_generic`. `centrality` is
  # LexRank-style TF-IDF degree centrality (what a sentence shares with the rest
  # of its source); `informativeness` is mean IDF of its distinct terms. The
  # first is the classical unsupervised extractive summariser and the fairer
  # counterpart to BM25, so it is the reported arm.
  nonllm_generic_scorer: centrality
  random_seed_salt: "exp14-mechanism"

# ---------------------------------------------------------------- the corpus
# The same 16 relation dossiers, 16 questions each, four rotating anchors.

dataset:
  active: relation_dossiers
  relation_dossiers:
    contexts_jsonl: data/communication_regret/relation_dossiers.jsonl
    n_contexts: 16
  squad_groups:
    contexts_jsonl: data/communication_regret/squad_groups.jsonl
    n_contexts: 24

baselines:
  # The UNBOUNDED pass-through: the reader sees the whole source, so this is the
  # no-compression ceiling U(D, q) and the reference term in every regret figure.
  # It is deliberately distinct from the budgeted `passthrough` arm above: the
  # dossiers run 389-517 words against a 160-word top budget, so no budgeted arm
  # can carry the source intact, and the budgeted form is necessarily prefix
  # truncation. Both are reported; neither substitutes for the other.
  direct_context: true
  closed_book_samples: 3

analysis:
  bootstrap_resamples: 10000
  ci_level: 0.95
  cluster: context
  primary_metric: judge_correct
  min_ceiling_for_ratio: 0.25
  pareto_epsilon: 0.0
  # The contrasts this experiment exists to make. Each pair is a single-factor
  # change; nothing here compares two arms that differ in both mechanism and
  # conditioning at once.
  comparisons:
    # Does task-aware selection specialise the message, per mechanism family?
    - [conditioned, generic]
    - [lm_conditioned, lm_generic]
    - [nonllm_conditioned, nonllm_generic]
    # Rewriting held against selection, at matched conditioning.
    - [conditioned, lm_conditioned]
    - [conditioned, nonllm_conditioned]
    - [generic, lm_generic]
    - [generic, nonllm_generic]
    # Is a learned scorer needed, or does lexical matching do it?
    - [lm_conditioned, nonllm_conditioned]
    - [lm_generic, nonllm_generic]
    # Rewriting alone, against rewriting with selection.
    - [paraphrase, generic]
    - [conditioned, paraphrase]
    # The floors: any effect a shuffle or a prefix reproduces is not about
    # relevance, and any selector that loses to the prefix is not earning its keep.
    - [nonllm_generic, random_selection]
    - [lm_generic, random_selection]
    - [nonllm_conditioned, passthrough]
    - [lm_conditioned, passthrough]
    - [nonllm_generic, passthrough]
    - [generic, passthrough]
    - [paraphrase, passthrough]
    # Retained from Experiment 10 so its published result reappears here.
    - [reusable, generic]
    - [oracle, conditioned]

outputs:
  run_root: runs/compression_mechanism
  result_root: results/compression_mechanism
  build_root: results/compression_mechanism

judge:
  enabled: true
  model_id: "openai/gpt-4o-mini"
  max_tokens: 8
  cap_usd: 4.0
  concurrency: 16
