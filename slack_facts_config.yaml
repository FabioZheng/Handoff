# Compressible-slack test on SQuAD: essential-fact load (k) x added filler (f).
# Filler is ADDED, never substituted for gold, so k and f vary independently
# and context width (k + f) is deliberately not held constant.
model:
  id: "meta-llama/llama-3.1-8b-instruct"
  provider_order: null
  require_parameters: false

decoding:
  top_p: 1.0
  orchestrator_temperature: 0.0
  subagent_temperature: 0.0
  answer_max_tokens: 256
  handoff_max_tokens: 700

cost:
  cap_usd: 3.0
  api_call_cap: 4000
  warn_at_fraction: 0.8

runtime:
  concurrency: 6
  max_retries: 4
  backoff_base_s: 1.5
  backoff_max_s: 30.0
  request_timeout_s: 120
  cache_dir: cache

dataset:
  parquet_url: "https://huggingface.co/datasets/rajpurkar/squad/resolve/refs%2Fconvert%2Fparquet/plain_text/validation/0000.parquet"
  local_parquet: data/raw/squad_validation.parquet
  sample_seed: 20260819
  n_packs: 20
  max_facts: 10

# k = essential facts (all present, all asked); f = filler passages added.
conditions:
  k2_f0:  {k: 2,  f: 0}
  k2_f5:  {k: 2,  f: 5}
  k2_f10: {k: 2,  f: 10}
  k5_f0:  {k: 5,  f: 0}
  k5_f5:  {k: 5,  f: 5}
  k5_f10: {k: 5,  f: 10}
  k10_f0:  {k: 10, f: 0}
  k10_f5:  {k: 10, f: 5}
  k10_f10: {k: 10, f: 10}

depths: [0, 1, 3, 5]
max_depth: 5

analysis:
  bootstrap_resamples: 10000
  ci_level: 0.95

outputs:
  data_root: data/slack_facts
  run_root: runs/slack_facts
  result_root: results/slack_facts
