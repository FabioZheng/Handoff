# Incremental-evidence extension of the sealed repeated-handoff chain.
# Model, decoding, cache, runtime, cost cap, and judge settings come from the
# shared --config file (config.yaml by default).

datasets:
  musique:
    local_parquet: data/raw/musique_validation.parquet
    parquet_url: https://huggingface.co/datasets/dgslibisey/MuSiQue/resolve/refs%2Fconvert%2Fparquet/default/validation/0000.parquet
    answerable_only: true

sampling:
  seed: 20260811
  n_target_per_dataset: 30
  n_candidates_per_dataset: 100

# One packet per distinct supporting paragraph. Multiple decomposition steps
# backed by the same paragraph become multiple hidden probes on one packet.
packets:
  minimum_count: 2

# Deterministically assign half the examples forward decomposition order and
# half reverse. The assigned order is identical across conditions, relay depths,
# and seeds for a given qid.
evidence_order:
  mode: counterbalanced  # forward | reverse | randomized | counterbalanced
  seed: 20260824

# The sole prompt difference is whether each specialist/relay sees the main
# question. Hidden packet probes are never shown to any chain agent.
conditions:
  question_conditioned:
    question_visible: true
  question_omitted:
    question_visible: false

# Exactly this many relay-only transformations are inserted between successive
# specialists. No relay receives a source packet.
relay_depths: [0, 1, 3, 5]
seeds: [1, 2]

analysis:
  bootstrap_resamples: 10000
  ci_level: 0.95
  primary_metric: f1

outputs:
  root: results/incremental_chain
  run_root: runs/incremental_chain
  data_root: data/incremental_chain
