# Pure retrieval-signal-ratio handoff pilot.  All ten gold passages for a
# query independently contain its answer-bearing SQuAD source paragraph; only
# the accompanying same-article context differs.
model:
  id: "meta-llama/llama-3.1-8b-instruct"
  provider_order: null
  require_parameters: false

decoding:
  top_p: 1.0
  orchestrator_temperature: 0.0
  subagent_temperature: 0.0
  answer_max_tokens: 64
  handoff_max_tokens: 700

cost:
  cap_usd: 0.25
  api_call_cap: 650
  warn_at_fraction: 0.8

runtime:
  concurrency: 2
  max_retries: 4
  backoff_base_s: 1.5
  backoff_max_s: 30.0
  request_timeout_s: 120
  cache_dir: cache

dataset:
  local_parquet: data/raw/squad_validation.parquet
  parquet_url: https://huggingface.co/datasets/rajpurkar/squad/resolve/refs%2Fconvert%2Fparquet/plain_text/validation/0000.parquet
  sample_seed: 20260818
  n_questions: 20
  smoke_questions: 2
  passages_per_query: 10
  # BM25 hard negatives: cross-article paragraphs the retriever ranks highly
  # for the question (lexically on-topic) but that don't contain an answer
  # alias, replacing a uniformly random unrelated paragraph as the distractor.
  bm25_top_k: 60
  # Bottom-ranked eligible paragraphs form the matched easy-negative arm.
  bm25_bottom_k: 1000

conditions:
  # Report/plot labels: no, medium, and high noise, respectively.
  signal_1_0: 10
  signal_0_5: 5
  signal_0_1: 1
negative_types: [hard, easy]
depths: [0, 1, 3, 5]
max_depth: 5

analysis:
  bootstrap_resamples: 10000
  ci_level: 0.95
  bertscore:
    enabled: true
    model_type: roberta-large
    num_layers: 17
    batch_size: 64
    rescale_with_baseline: true

outputs:
  data_root: data/redundant_signal_ratio
  run_root: runs/redundant_signal_ratio
  result_root: results/redundant_signal_ratio

# LLM judge: answer-correctness vs the gold answer, as a semantic complement to
# EM/F1 (which remain primary). Deliberately a different model family from the
# systems under test, so a model is never grading its own family's outputs.
judge:
  enabled: true
  model_id: "openai/gpt-4o-mini"
  max_tokens: 8
  cap_usd: 2.0
